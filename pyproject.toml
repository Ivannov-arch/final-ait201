[project]
name = "food-clearing-house"
version = "0.1.0"
description = "Dynamic Food Clearing House Simulator for Malaysia (AIT-201)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Data Processing & ML
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "pyarrow>=16.0.0",
    "joblib>=1.4.0",

    # API & Backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",

    # Database & Cloud
    "supabase>=2.5.0",
]

[project.optional-dependencies]
dev = [
    # Exploratory Data Analysis & Notebooks
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pytest>=8.2.0",
]
